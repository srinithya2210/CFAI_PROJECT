
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  .app{
    --bg:#0f0f18;--surface:#1a1a2a;--surface2:#23233a;--surface3:#2c2c48;
    --ink:#f0f0ff;--ink2:#c8c8e8;--ink3:#8888aa;
    --accent:#7c6fff;--accent-bg:#2a2550;--accent-dim:#4a44aa;
    --ok:#2d9e75;--ok-bg:#0d3028;
    --err:#e05555;--err-bg:#3a1010;
    --warn:#d4902a;--warn-bg:#3a2808;
    --border:#2e2e50;--border2:#3e3e68;
    --given:#f0f0ff;--user-clr:#a899ff;--conflict-clr:#ff6b6b;
    --sel-bg:#2a2550;--hl-bg:#1e1e38;
    --cell-bg:#1a1a2a;
  }
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);padding:0}
  h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

  .app{max-width:680px;margin:0 auto;padding:1.5rem 1rem 3rem;background:var(--bg);border-radius:12px}
  .header{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
  .logo{width:40px;height:40px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .logo svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
  .title{font-family:'Space Mono',monospace;font-size:1.25rem;font-weight:700;color:var(--ink);letter-spacing:.04em}
  .subtitle{font-size:13px;color:var(--ink3);margin-top:2px}
  .dark-badge{margin-left:auto;font-size:11px;background:var(--surface2);color:var(--ink3);padding:4px 10px;border-radius:20px;border:0.5px solid var(--border2)}

  .tabs{display:flex;gap:6px;margin-bottom:1.25rem;background:var(--surface2);border-radius:10px;padding:4px;border:0.5px solid var(--border)}
  .tab{flex:1;padding:8px 0;font-size:13px;font-weight:500;border:none;background:transparent;border-radius:7px;cursor:pointer;color:var(--ink3);transition:all .18s;font-family:'DM Sans',sans-serif}
  .tab.active{background:var(--surface3);color:var(--accent)}

  .panel{display:none}.panel.active{display:block}

  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
  .btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);font-size:13px;font-weight:500;cursor:pointer;color:var(--ink2);transition:all .16s;font-family:'DM Sans',sans-serif}
  .btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:#6b5fee}
  .btn:disabled{opacity:.35;cursor:not-allowed}

  .diff-select{padding:7px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);font-size:13px;font-family:'DM Sans',sans-serif;color:var(--ink2);cursor:pointer}
  .diff-select:focus{outline:none;border-color:var(--accent)}
  .diff-select option{background:var(--surface2)}

  .board-wrap{display:flex;justify-content:center;margin-bottom:1rem}
  .board{display:grid;grid-template-columns:repeat(9,1fr);gap:0;border:2.5px solid var(--ink2);border-radius:4px;overflow:hidden;width:min(100%,432px);aspect-ratio:1}

  .cell{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace;font-size:clamp(12px,3.2vw,20px);font-weight:700;
    border:0.5px solid var(--border);cursor:pointer;
    background:var(--cell-bg);color:var(--given);transition:background .1s;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  .cell:nth-child(3n){border-right:2px solid var(--border2)}
  .cell:nth-child(9n){border-right:none}
  .cell:nth-child(n+19):nth-child(-n+27){border-bottom:2px solid var(--border2)}
  .cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--border2)}
  .cell.given{color:var(--given)}
  .cell.user-input{color:var(--user-clr)}
  .cell.selected{background:var(--sel-bg)}
  .cell.highlight{background:var(--hl-bg)}
  .cell.conflict{background:var(--err-bg);color:var(--conflict-clr)}
  .cell.solved-anim{animation:popIn .25s ease}
  @keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

  .numpad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-bottom:1rem;max-width:432px;margin-left:auto;margin-right:auto}
  .numpad-btn{padding:8px 0;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);font-family:'Space Mono',monospace;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink2);transition:all .14s}
  .numpad-btn:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
  .numpad-btn.erase{font-size:11px;color:var(--ink3)}

  .status-bar{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:.75rem;min-height:28px}
  .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .status-dot.ok{background:var(--ok)}
  .status-dot.err{background:var(--err)}
  .status-dot.warn{background:var(--warn)}
  .status-dot.idle{background:var(--ink3)}
  .status-msg{color:var(--ink2)}

  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
  .stat{background:var(--surface2);border-radius:8px;padding:.75rem 1rem;text-align:center;border:0.5px solid var(--border)}
  .stat-val{font-family:'Space Mono',monospace;font-size:1.2rem;font-weight:700;color:var(--accent)}
  .stat-lbl{font-size:11px;color:var(--ink3);margin-top:2px}

  .solve-hint{font-size:12px;color:var(--ink3);margin-bottom:.5rem;text-align:center}

  @media(max-width:420px){.title{font-size:1rem}.btn{padding:7px 12px;font-size:12px}.numpad-btn{font-size:13px}}
</style>

<h2 class="sr-only">Sudoku Solver and Generator — dark mode — generate puzzles or solve your own</h2>

<div class="app">
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24"><rect x="2" y="2" width="8" height="8" rx="1"/><rect x="10" y="2" width="4" height="4" rx="1"/><rect x="14" y="6" width="8" height="4" rx="1"/><rect x="2" y="14" width="4" height="8" rx="1"/><rect x="10" y="10" width="12" height="12" rx="1"/></svg>
    </div>
    <div>
      <div class="title">SUDOKU</div>
      <div class="subtitle">Solver &amp; Generator</div>
    </div>
    <span class="dark-badge">Dark mode</span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('generate')">Generate Puzzle</button>
    <button class="tab" onclick="switchTab('solve')">Solve Yours</button>
  </div>

  <div id="panel-generate" class="panel active">
    <div class="controls">
      <select class="diff-select" id="difficulty">
        <option value="easy">Easy (36–45 clues)</option>
        <option value="medium" selected>Medium (27–35 clues)</option>
        <option value="hard">Hard (22–26 clues)</option>
      </select>
      <button class="btn primary" id="gen-btn" onclick="generatePuzzle()">New Puzzle</button>
      <button class="btn" id="solve-btn" onclick="solvePuzzle()" disabled>Solve</button>
      <button class="btn" id="reset-btn" onclick="resetToOriginal()" disabled>Reset</button>
    </div>
    <div id="status-gen" class="status-bar"><span class="status-dot idle"></span><span class="status-msg">Press "New Puzzle" to begin</span></div>
    <div class="stats-row">
      <div class="stat"><div class="stat-val" id="stat-clues">—</div><div class="stat-lbl">Clues</div></div>
      <div class="stat"><div class="stat-val" id="stat-filled">—</div><div class="stat-lbl">Filled</div></div>
      <div class="stat"><div class="stat-val" id="stat-time">—</div><div class="stat-lbl">Gen (ms)</div></div>
    </div>
    <div class="board-wrap"><div class="board" id="board-gen"></div></div>
    <div class="numpad" id="numpad-gen"></div>
  </div>

  <div id="panel-solve" class="panel">
    <div class="controls">
      <button class="btn primary" onclick="solveUserBoard()">Solve</button>
      <button class="btn" onclick="clearUserBoard()">Clear</button>
    </div>
    <div id="status-solve" class="status-bar"><span class="status-dot idle"></span><span class="status-msg">Click a cell and type a digit (0 = empty)</span></div>
    <div class="solve-hint">Enter your puzzle below. Click a cell and use keyboard or numpad.</div>
    <div class="board-wrap"><div class="board" id="board-solve"></div></div>
    <div class="numpad" id="numpad-solve"></div>
  </div>
</div>

<script>
const DIFF={easy:[36,45],medium:[27,35],hard:[22,26]};
let state={
  gen:{board:null,solution:null,original:null,selected:null,solved:false},
  solve:{board:null,selected:null,solved:false}
};

function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cloneBoard(b){return b.map(r=>[...r])}

function isValid(board,row,col,num){
  if(board[row].includes(num))return false;
  for(let r=0;r<9;r++)if(board[r][col]===num)return false;
  const br=Math.floor(row/3)*3,bc=Math.floor(col/3)*3;
  for(let r=br;r<br+3;r++)for(let c=bc;c<bc+3;c++)if(board[r][c]===num)return false;
  return true;
}
function findEmpty(board){
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(board[r][c]===0)return[r,c];
  return null;
}
function solve(board){
  const pos=findEmpty(board);
  if(!pos)return true;
  const[row,col]=pos;
  for(let n=1;n<=9;n++){
    if(isValid(board,row,col,n)){
      board[row][col]=n;
      if(solve(board))return true;
      board[row][col]=0;
    }
  }
  return false;
}
function countSolutions(board,limit=2){
  const pos=findEmpty(board);
  if(!pos)return 1;
  const[row,col]=pos;
  let count=0;
  for(let n=1;n<=9;n++){
    if(isValid(board,row,col,n)){
      board[row][col]=n;
      count+=countSolutions(board,limit);
      board[row][col]=0;
      if(count>=limit)break;
    }
  }
  return count;
}
function generateFull(){
  const board=Array.from({length:9},()=>Array(9).fill(0));
  const nums=[1,2,3,4,5,6,7,8,9];
  function fill(b){
    const pos=findEmpty(b);
    if(!pos)return true;
    const[r,c]=pos;
    shuffle(nums);
    for(const n of nums){
      if(isValid(b,r,c,n)){b[r][c]=n;if(fill(b))return true;b[r][c]=0;}
    }
    return false;
  }
  fill(board);
  return board;
}
function generatePuzzle(){
  const btn=document.getElementById('gen-btn');
  btn.disabled=true;btn.textContent='Generating…';
  setStatus('gen','warn','Generating puzzle…');
  setTimeout(()=>{
    const t0=performance.now();
    const diff=document.getElementById('difficulty').value;
    const full=generateFull();
    const puzzle=cloneBoard(full);
    const[clueMin,clueMax]=DIFF[diff];
    const target=randInt(clueMin,clueMax);
    const cells=shuffle([...Array(81).keys()]);
    let removed=0;
    for(const idx of cells){
      if(81-removed<=target)break;
      const r=Math.floor(idx/9),c=idx%9;
      const backup=puzzle[r][c];
      puzzle[r][c]=0;
      const test=cloneBoard(puzzle);
      if(countSolutions(test)!==1)puzzle[r][c]=backup;
      else removed++;
    }
    const elapsed=Math.round(performance.now()-t0);
    state.gen.board=cloneBoard(puzzle);
    state.gen.solution=full;
    state.gen.original=cloneBoard(puzzle);
    state.gen.selected=null;
    state.gen.solved=false;
    const clues=puzzle.flat().filter(v=>v>0).length;
    document.getElementById('stat-clues').textContent=clues;
    document.getElementById('stat-filled').textContent=clues;
    document.getElementById('stat-time').textContent=elapsed;
    renderBoard('gen');
    setStatus('gen','ok',`${diff.charAt(0).toUpperCase()+diff.slice(1)} puzzle ready — ${clues} clues`);
    btn.disabled=false;btn.textContent='New Puzzle';
    document.getElementById('solve-btn').disabled=false;
    document.getElementById('reset-btn').disabled=false;
  },20);
}
function solvePuzzle(){
  if(!state.gen.board)return;
  const board=cloneBoard(state.gen.board);
  const ok=solve(board);
  if(ok){
    state.gen.board=board;state.gen.solved=true;
    renderBoard('gen',true);
    document.getElementById('stat-filled').textContent=board.flat().filter(v=>v>0).length;
    setStatus('gen','ok','Solved! ✓');
  } else {
    setStatus('gen','err','No solution found for this board state');
  }
}
function resetToOriginal(){
  if(!state.gen.original)return;
  state.gen.board=cloneBoard(state.gen.original);
  state.gen.solved=false;state.gen.selected=null;
  document.getElementById('stat-filled').textContent=state.gen.original.flat().filter(v=>v>0).length;
  renderBoard('gen');
  setStatus('gen','idle','Puzzle reset');
}
function solveUserBoard(){
  if(!state.solve.board)initSolveBoard();
  const board=cloneBoard(state.solve.board);
  const ok=solve(board);
  if(ok){
    state.solve.board=board;state.solve.solved=true;
    renderBoard('solve',true);
    setStatus('solve','ok','Solved! ✓');
  } else {
    setStatus('solve','err','No solution exists — check your input');
  }
}
function clearUserBoard(){
  state.solve.board=Array.from({length:9},()=>Array(9).fill(0));
  state.solve.selected=null;state.solve.solved=false;
  renderBoard('solve');
  setStatus('solve','idle','Board cleared — enter your puzzle');
}
function initSolveBoard(){
  if(!state.solve.board)state.solve.board=Array.from({length:9},()=>Array(9).fill(0));
}
function getConflicts(board){
  const conf=new Set();
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const v=board[r][c];if(!v)continue;
    for(let c2=0;c2<9;c2++)if(c2!==c&&board[r][c2]===v)conf.add(r*9+c);
    for(let r2=0;r2<9;r2++)if(r2!==r&&board[r2][c]===v)conf.add(r*9+c);
    const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
    for(let rr=br;rr<br+3;rr++)for(let cc=bc;cc<bc+3;cc++)if((rr!==r||cc!==c)&&board[rr][cc]===v)conf.add(r*9+c);
  }
  return conf;
}
function renderBoard(mode,animated=false){
  const el=document.getElementById('board-'+mode);
  const s=state[mode];
  const board=s.board||(mode==='solve'?Array.from({length:9},()=>Array(9).fill(0)):null);
  if(!board){el.innerHTML='<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;height:200px;color:#8888aa;font-size:13px">Press "New Puzzle" to start</div>';return;}
  const original=mode==='gen'?s.original:null;
  const conflicts=getConflicts(board);
  const sel=s.selected;
  let selRow=-1,selCol=-1;
  if(sel!==null){selRow=Math.floor(sel/9);selCol=sel%9;}
  el.innerHTML='';
  board.forEach((row,r)=>{
    row.forEach((val,c)=>{
      const idx=r*9+c;
      const div=document.createElement('div');
      div.className='cell';
      const isGiven=original?original[r][c]>0:false;
      const isConflict=conflicts.has(idx);
      const isSel=sel===idx;
      const isHighlight=selRow>=0&&(r===selRow||c===selCol||(Math.floor(r/3)===Math.floor(selRow/3)&&Math.floor(c/3)===Math.floor(selCol/3)));
      if(isConflict)div.classList.add('conflict');
      else if(isSel)div.classList.add('selected');
      else if(isHighlight)div.classList.add('highlight');
      if(isGiven)div.classList.add('given');
      else if(val&&!isConflict)div.classList.add('user-input');
      if(val)div.textContent=val;
      if(animated&&val&&!isGiven)div.classList.add('solved-anim');
      div.addEventListener('click',()=>selectCell(mode,idx));
      el.appendChild(div);
    });
  });
}
function selectCell(mode,idx){
  const s=state[mode];
  if(mode==='gen'&&s.original){
    const r=Math.floor(idx/9),c=idx%9;
    if(s.original[r][c]>0){s.selected=idx;renderBoard(mode);return;}
  }
  s.selected=s.selected===idx?null:idx;
  renderBoard(mode);
}
function enterDigit(mode,num){
  const s=state[mode];
  if(s.selected===null)return;
  const r=Math.floor(s.selected/9),c=s.selected%9;
  if(mode==='gen'&&s.original&&s.original[r][c]>0)return;
  if(!s.board)s.board=Array.from({length:9},()=>Array(9).fill(0));
  s.board[r][c]=num;
  if(mode==='gen'){
    document.getElementById('stat-filled').textContent=s.board.flat().filter(v=>v>0).length;
  }
  renderBoard(mode);
  if(mode==='gen'&&s.board&&findEmpty(s.board)===null){
    if(getConflicts(s.board).size===0)setStatus('gen','ok','Puzzle complete! ✓');
  }
}
function buildNumpad(mode){
  const el=document.getElementById('numpad-'+mode);
  el.innerHTML='';
  for(let n=1;n<=9;n++){
    const b=document.createElement('button');
    b.className='numpad-btn';b.textContent=n;
    b.addEventListener('click',()=>enterDigit(mode,n));
    el.appendChild(b);
  }
  const er=document.createElement('button');
  er.className='numpad-btn erase';er.textContent='✕';
  er.addEventListener('click',()=>enterDigit(mode,0));
  el.appendChild(er);
}
function setStatus(mode,type,msg){
  document.getElementById('status-'+mode).innerHTML=`<span class="status-dot ${type}"></span><span class="status-msg">${msg}</span>`;
}
function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',['generate','solve'][i]===tab)});
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  if(tab==='solve'&&!state.solve.board){
    state.solve.board=Array.from({length:9},()=>Array(9).fill(0));
    renderBoard('solve');
  }
}
document.addEventListener('keydown',e=>{
  const activePanel=document.querySelector('.panel.active');
  const mode=activePanel&&activePanel.id==='panel-solve'?'solve':'gen';
  const s=state[mode];
  if(s.selected===null)return;
  if(e.key>='1'&&e.key<='9'){enterDigit(mode,parseInt(e.key));e.preventDefault();}
  else if(e.key==='0'||e.key==='Backspace'||e.key==='Delete'){enterDigit(mode,0);e.preventDefault();}
  else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
    let r=Math.floor(s.selected/9),c=s.selected%9;
    if(e.key==='ArrowUp')r=Math.max(0,r-1);
    else if(e.key==='ArrowDown')r=Math.min(8,r+1);
    else if(e.key==='ArrowLeft')c=Math.max(0,c-1);
    else if(e.key==='ArrowRight')c=Math.min(8,c+1);
    s.selected=r*9+c;renderBoard(mode);
  }
});
buildNumpad('gen');
buildNumpad('solve');
renderBoard('gen');
state.solve.board=Array.from({length:9},()=>Array(9).fill(0));
renderBoard('solve');
</script>
